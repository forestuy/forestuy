<!doctype html><html lang="es-UY"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#09080b"><title>Forest · Administración</title><link rel="stylesheet" href="/admin/admin.css"><script src="/admin/admin.js" defer></script></head><body><main><header><a href="/" class="brand">FOREST</a><a href="/" target="_blank" rel="noopener">Ver página ↗</a></header><p class="eyebrow">ADMINISTRACIÓN</p><h1>Tu equipo de RRPP.</h1><p id="message" role="status" aria-live="polite">Comprobando acceso…</p><section id="login-section" hidden><form id="login" class="panel"><h2>Ingresá a tu panel</h2><label>Usuario<input name="username" autocomplete="username" value="admin" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" maxlength="512" required></label><button type="submit" class="primary">Ingresar</button></form></section><section id="dashboard" hidden><div class="toolbar"><p id="total"></p><div><button id="reload" type="button">Actualizar lista</button><button id="logout" type="button">Cerrar sesión</button></div></div><div class="workspace"><form id="editor" class="panel"><h2 id="editor-title">Agregar RRPP</h2><label>Nombre<input name="name" maxlength="60" required placeholder="Ej. Axel"></label><label>Localidad<input name="city" maxlength="80" required list="cities" placeholder="Ej. Los Cerrillos"></label><datalist id="cities"><option value="Los Cerrillos"><option value="Las Piedras"><option value="Santa Lucía"><option value="Canelones"><option value="Montevideo"></datalist><label>WhatsApp<input name="whatsapp" type="tel" placeholder="Ej. 093 621 742" maxlength="30"></label><label>Instagram<input name="instagram" placeholder="@usuario o enlace al perfil" maxlength="300"></label><p class="help">Agregá al menos un contacto. Los cambios se publican al guardar.</p><div class="actions"><button type="submit" class="primary">Guardar RRPP</button><button id="cancel" type="button" hidden>Cancelar edición</button></div></form><section class="panel"><h2>RRPP publicados</h2><div id="list"></div></section></div></section></main></body></html>
